name: Promotion Crawler

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      retailer:
        description: "Retailer to crawl"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - cu
          - gs25
          - emart24

jobs:
  crawl:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Supabase secrets
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is empty. Add it in Repository Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is empty. Add the service_role key in Repository Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          echo "Supabase secrets are present."

      - name: Install dependencies
        working-directory: crawler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run crawler
        run: |
          python crawler/run.py --retailer "${{ github.event.inputs.retailer || 'all' }}" --upload

      - name: Upload crawler report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-report
          path: crawler/output/latest.json
